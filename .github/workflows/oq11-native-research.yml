name: OQ-11 native research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OQ_DISTRIBUTE: "no"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-py313-linux64.txt
          python -m pip install -e .
          python -m pip install -r requirements-aelo-py-linux64.txt
          oq engine --upgrade-db
      - name: Run native invariant
        run: |
          python -m pytest -s -v openquake/calculators/tests/test_sparse_realization_research.py
